<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc">
<title id="title">Three ideas for augmenting human abilities</title><desc id="desc">Room Guide adds arrows to a corridor, Read Along translates a sign, and Step Lens marks a machine control. These are original schematic concept sketches.</desc>
<rect width="1000" height="1180" fill="#f5f3ec"/>
<g font-family="Arial,sans-serif" fill="#253d3a"><text x="42" y="48" font-size="16" letter-spacing="3">LECTURE 7 / CONCEPT SKETCHES</text><text x="42" y="94" font-size="34" font-weight="bold">Three small additions to the real world</text>
<g fill="#fffdf6" stroke="#b4c4bd" stroke-width="2"><rect x="40" y="132" width="920" height="300" rx="16"/><rect x="40" y="462" width="920" height="300" rx="16"/><rect x="40" y="792" width="920" height="300" rx="16"/></g>
<g stroke="#9aa8a0" stroke-width="3" fill="none"><path d="M75 160L220 240H400L540 160M75 398L220 325H400L540 398M220 240V325M400 240V325"/><rect x="100" y="198" width="66" height="140"/><rect x="445" y="198" width="66" height="140"/></g>
<rect x="225" y="265" width="190" height="53" rx="10" fill="#d8ed6e"/><path d="M250 292H385M370 278L385 292L370 306" fill="none" stroke="#253d3a" stroke-width="5"/>
<text x="160" y="373" font-size="17">Next junction: turn right</text>
<text x="595" y="192" font-size="17">01 / WAYFINDING</text><text x="595" y="234" font-size="30" font-weight="bold">Room Guide</text><text x="595" y="280" font-size="21">Find a room without</text><text x="595" y="310" font-size="21">matching two maps.</text><text x="595" y="366" font-size="17">Risk: uncertain positioning.</text>
<rect x="90" y="520" width="280" height="110" rx="6" fill="#e6e3d8" stroke="#9aa8a0" stroke-width="3"/><text x="125" y="585" font-size="29">SORTIE</text><path d="M305 580h30m-10-10l10 10-10 10" fill="none" stroke="#253d3a" stroke-width="3"/>
<path d="M340 640L382 660" stroke="#38726b" stroke-width="2"/><rect x="264" y="657" width="254" height="60" rx="10" fill="#d8ed6e"/><text x="286" y="694" font-size="25">Exit →</text>
<text x="595" y="522" font-size="17">02 / LANGUAGE</text><text x="595" y="564" font-size="30" font-weight="bold">Read Along</text><text x="595" y="610" font-size="21">Keep the original sign.</text><text x="595" y="640" font-size="21">Add a short translation.</text><text x="595" y="696" font-size="17">Risk: missing context.</text>
<g fill="none" stroke="#9aa8a0" stroke-width="3"><rect x="105" y="839" width="290" height="204" rx="12"/><rect x="135" y="866" width="230" height="65"/><circle cx="160" cy="985" r="20"/><circle cx="238" cy="985" r="20"/></g><circle cx="315" cy="985" r="24" fill="#d8ed6e" stroke="#38726b" stroke-width="3"/><path d="M342 977L393 942" stroke="#38726b" stroke-width="2"/><rect x="358" y="874" width="178" height="70" rx="10" fill="#d8ed6e"/><text x="376" y="904" font-size="18">Step 2</text><text x="376" y="929" font-size="18">Press this button</text>
<text x="595" y="852" font-size="17">03 / PROCEDURES</text><text x="595" y="894" font-size="30" font-weight="bold">Step Lens</text><text x="595" y="940" font-size="21">One action at a time,</text><text x="595" y="970" font-size="21">beside the right part.</text><text x="595" y="1026" font-size="17">Risk: incorrect guidance.</text>
<text x="42" y="1140" font-size="16">Drawn scenes and overlays. These sketches show concepts, not working AR tracking.</text></g></svg>
