<text x="70" y="870" font-size="27" font-weight="bold">Fix Together</text><text x="70" y="905" font-size="19">Let a remote helper point to the part</text>
<rect x="102" y="938" width="350" height="150" rx="12" fill="#e9e4d8" stroke="#9aa8a0" stroke-width="3"/><g fill="#fffdf6" stroke="#9aa8a0" stroke-width="2"><rect x="139" y="990" width="56" height="28"/><rect x="217" y="990" width="56" height="28"/><rect x="295" y="990" width="56" height="28"/></g><ellipse cx="323" cy="1004" rx="43" ry="31" fill="none" stroke="#38726b" stroke-width="4"/><path d="M366 997L480 972" stroke="#38726b" stroke-width="3"/><rect x="480" y="936" width="200" height="69" rx="10" fill="#d8ed6e"/><text x="497" y="966" font-size="20">This connector</text><text x="497" y="991" font-size="16">Mark from your helper</text><text x="730" y="984" font-size="19">Camera sharing</text><text x="730" y="1013" font-size="19">stays visible.</text><text x="730" y="1062" font-size="16">End call at any time.</text>
