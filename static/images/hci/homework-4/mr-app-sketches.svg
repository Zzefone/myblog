<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1230" role="img" aria-labelledby="title desc">
<title id="title">Three everyday MR apps</title><desc id="desc">Proposed views for Translate, Waypoint and Fix Together. These sketches are imagined interfaces, not screenshots of released applications.</desc>
<rect width="1000" height="1230" fill="#f5f3ec"/>
<g font-family="Arial,sans-serif" fill="#253d3a"><text x="42" y="48" font-size="16" letter-spacing="3">LECTURE 12 / AN IMAGINED MR APP STORE</text><text x="42" y="94" font-size="34" font-weight="bold">Useful in the moment</text>
<g fill="#fffdf6" stroke="#b4c4bd" stroke-width="2"><rect x="40" y="133" width="920" height="315" rx="16"/><rect x="40" y="478" width="920" height="315" rx="16"/><rect x="40" y="823" width="920" height="315" rx="16"/></g>
<text x="70" y="180" font-size="27" font-weight="bold">Translate</text><text x="70" y="215" font-size="19">Menu / signs / captions</text>
<rect x="90" y="244" width="290" height="150" rx="7" fill="#e9e4d8" stroke="#9aa8a0" stroke-width="2"/><text x="115" y="285" font-size="24">MENU DU JOUR</text><text x="115" y="325" font-size="22">Soupe de légumes</text><text x="115" y="365" font-size="22">12 €</text>
<rect x="440" y="269" width="235" height="80" rx="12" fill="#d8ed6e"/><text x="459" y="302" font-size="22">Vegetable soup</text><text x="459" y="331" font-size="16">French → English</text><path d="M390 310H431" stroke="#38726b" stroke-width="3"/>
<text x="730" y="284" font-size="19">Keep the original</text><text x="730" y="313" font-size="19">text visible.</text><text x="730" y="362" font-size="16">Tap to expand.</text>
<text x="70" y="525" font-size="27" font-weight="bold">Waypoint</text><text x="70" y="560" font-size="19">One direction at the next junction</text>
<g fill="none" stroke="#9aa8a0" stroke-width="3"><path d="M95 588L260 653H500L660 588M95 758L260 704H500L660 758M260 653V704M500 653V704"/></g>
