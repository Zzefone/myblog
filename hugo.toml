baseURL = "https://zzefone.github.io/myblog/"
title = "WANG Zhaofeng · Course Portfolio"
theme = "hugo-coder"
locale = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
ignoreFiles = [
  "(?i)\\.pt-br\\.md$",
  "content/posts/(emoji-support|external-post|html-and-css-only-tabs|markdown-syntax|math-typesetting|mermaid-support|more-rich-content|placeholder-text|rich-content)\\.md$",
]

[pagination]
pagerSize = 12

[markup]
  [markup.highlight]
  noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
    unsafe = true

[params]
author = "WANG Zhaofeng"
description = "A course portfolio for Computer Graphics, AI, XR, and Human-Computer Interaction"
keywords = "computer graphics, computer vision, AI, HCI, augmented reality, virtual reality, course portfolio"
info = ["Master's Course Portfolio", "CG · AI · XR · HCI"]
avatarURL = "images/avatar.jpg"
dateFormat = "2006-01-02"
since = 2026
colorScheme = "dark"
hideColorSchemeToggle = false
maxSeeAlsoItems = 4
customCSS = ["css/portfolio.css"]

[taxonomies]
category = "categories"
tag = "tags"

[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/Zzefone"

[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 2
url = "/index.xml"
rel = "alternate"
type = "application/rss+xml"

[languages.en]
label = "English"
title = "WANG Zhaofeng · Course Portfolio"

